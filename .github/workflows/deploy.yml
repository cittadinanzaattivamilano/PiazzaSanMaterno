name: Aggiorna e pubblica la pagina

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"    # ogni 5 minuti (il minimo di GitHub)
  workflow_dispatch:
  repository_dispatch:
    types: [tally-submission]   # segnale istantaneo da Tally (via Make, Zapier o n8n)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Costruisci la pagina dai dati di Tally
        run: node scripts/build.mjs
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          EXCLUDE_NAMES: ${{ vars.EXCLUDE_NAMES }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true   # a volte GitHub non trova subito il pacchetto appena caricato
      - name: Attendi prima di riprovare
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
