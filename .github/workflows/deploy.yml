name: Aggiorna e pubblica la pagina

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Costruisci la pagina dai dati di Tally
        run: node scripts/build.mjs
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          EXCLUDE_NAMES: ${{ vars.EXCLUDE_NAMES }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
